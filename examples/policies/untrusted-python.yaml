apiVersion: rokhoghab.io/v1
kind: EgressPolicy
metadata:
  name: untrusted-python
  tier: profile
  priority: 10
spec:
  defaultAction: deny
  selector:
    profiles:
      - untrusted-python
  rules:
    - name: python-package-index
      action: allow
      destinations:
        hostnames:
          - pypi.org
        hostnameSuffixes:
          - pythonhosted.org
      ports: [443]
      protocols: [https]
      rateLimit:
        requestsPerSecond: 20
      bandwidth:
        bytesPerSecond: 10M
