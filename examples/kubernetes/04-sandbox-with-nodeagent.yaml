apiVersion: v1
kind: Pod
metadata:
  name: enforced-sandbox
  namespace: execution
  labels:
    app.kubernetes.io/name: enforced-sandbox
    app.kubernetes.io/part-of: rokh-oghab
    rokhoghab.io/profile: enforced
  annotations:
    rokhoghab.io/enforcement: node
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: sandbox
      image: python:3.12-alpine
      command: ["python", "-c", "import time; time.sleep(3600)"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        privileged: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi
