apiVersion: v1
kind: Pod
metadata:
  name: python-sandbox
  namespace: execution
  labels:
    app.kubernetes.io/name: python-sandbox
    app.kubernetes.io/part-of: rokh-oghab
    rokhoghab.io/profile: untrusted-python
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: sandbox
      image: python:3.12-alpine
      command: ["python", "-c", "import time; time.sleep(3600)"]
      env:
        - name: HTTP_PROXY
          value: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
        - name: HTTPS_PROXY
          value: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
        - name: http_proxy
          value: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
        - name: https_proxy
          value: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
        - name: NO_PROXY
          value: ""
        - name: RO_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: sandbox-egress
              key: token
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        privileged: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: workspace
      emptyDir:
        sizeLimit: 1Gi
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 10.96.0.53
    searches:
      - execution.svc.cluster.local
      - svc.cluster.local
    options:
      - name: ndots
        value: "2"
