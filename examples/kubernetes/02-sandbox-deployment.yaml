apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-runner
  namespace: execution
  labels:
    app.kubernetes.io/part-of: rokh-oghab
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-runner
  namespace: execution
  labels:
    app.kubernetes.io/name: sandbox-runner
    app.kubernetes.io/part-of: rokh-oghab
    rokhoghab.io/profile: untrusted-python
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-runner
        app.kubernetes.io/part-of: rokh-oghab
        rokhoghab.io/profile: untrusted-python
    spec:
      serviceAccountName: sandbox-runner
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: python:3.12-alpine
          command: ["python", "-c", "import time; time.sleep(86400)"]
          envFrom:
            - configMapRef:
                name: sandbox-egress-env
          env:
            - name: RO_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-egress
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-egress-env
  namespace: execution
  labels:
    app.kubernetes.io/part-of: rokh-oghab
data:
  HTTP_PROXY: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
  HTTPS_PROXY: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
  http_proxy: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
  https_proxy: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
  NO_PROXY: ""
  PIP_PROXY: http://rokh-oghab-gateway.rokh-oghab.svc.cluster.local:3128
