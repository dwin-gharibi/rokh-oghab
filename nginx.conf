worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr notice;
pid /run/rokh-oghab/gateway.pid;
daemon off;

env RO_CONFIG;
env RO_NODE;
env RO_MODE;
env RO_BUNDLE_FILE;
env RO_CONTROLLER_URL;
env RO_CONTROLLER_TOKEN;
env RO_CONTROLLER_POLL_SECONDS;
env RO_CONTROLLER_FAIL_CLOSED;
env RO_ADMIN_TOKEN;
env RO_AUDIT_PATH;
env RO_AUDIT_LEVEL;
env RO_AUDIT_LOG_PATHS;
env RO_ALLOW_ANONYMOUS;
env RO_STRICT_PATH;
env RO_STRICT_SNI;
env RO_MIN_TLS_VERSION;
env RO_RESOLVER_SERVERS;

events {
    worker_connections 16384;
    multi_accept on;
}

stream {
    lua_package_path "/usr/local/rokh-oghab/lua/?.lua;;";
    lua_code_cache on;
    lua_socket_log_errors off;

    lua_shared_dict ro_policy 32m;
    lua_shared_dict ro_metrics 16m;
    lua_shared_dict ro_limits 32m;
    lua_shared_dict ro_dnscache 16m;
    lua_shared_dict ro_audit 16m;
    lua_shared_dict ro_state 1m;

    init_by_lua_block {
        require("ro.init").init()
    }

    init_worker_by_lua_block {
        require("ro.init").init_worker()
    }

    server {
        listen 3128 backlog=8192 so_keepalive=on;
        preread_timeout 10s;
        content_by_lua_block {
            local init = require("ro.init")
            require("ro.proxy").run(init.config(), "explicit")
        }
    }

    server {
        listen 3080 backlog=8192 so_keepalive=on;
        content_by_lua_block {
            local init = require("ro.init")
            require("ro.proxy").run(init.config(), "transparent_http", 80)
        }
    }

    server {
        listen 3443 backlog=8192 so_keepalive=on;
        content_by_lua_block {
            local init = require("ro.init")
            require("ro.proxy").run(init.config(), "transparent_tls", 443)
        }
    }

    server {
        listen 5353 udp;
        content_by_lua_block {
            local init = require("ro.init")
            require("ro.dns_server").run_udp(init.config())
        }
    }

    server {
        listen 5353;
        content_by_lua_block {
            local init = require("ro.init")
            require("ro.dns_server").run_tcp(init.config())
        }
    }

    server {
        listen 9145 backlog=512;
        content_by_lua_block {
            local init = require("ro.init")
            require("ro.adminapi").run(init.config())
        }
    }
}
