{{- if and .Values.tokens.create (not .Values.tokens.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rokh-oghab.tokenSecretName" . }}
  namespace: {{ include "rokh-oghab.namespace" . }}
  labels:
    {{- include "rokh-oghab.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin: {{ default (randAlphaNum 40) .Values.tokens.controller.admin | b64enc | quote }}
  operator: {{ default (randAlphaNum 40) .Values.tokens.controller.operator | b64enc | quote }}
  reader: {{ default (randAlphaNum 40) .Values.tokens.controller.reader | b64enc | quote }}
  gateway: {{ default (randAlphaNum 40) .Values.tokens.controller.gateway | b64enc | quote }}
  gatewayAdmin: {{ default (randAlphaNum 40) .Values.tokens.gatewayAdmin | b64enc | quote }}
  gatewayAdminOperator: {{ default (randAlphaNum 40) .Values.tokens.gatewayAdminOperator | b64enc | quote }}
  gatewayAdminReader: {{ default (randAlphaNum 40) .Values.tokens.gatewayAdminReader | b64enc | quote }}
  bundleSigning: {{ default (randAlphaNum 48) .Values.tokens.bundleSigning | b64enc | quote }}
{{- end }}
