{{- if .Values.agent.enabled }}
{{- if not .Values.gateway.service.clusterIP }}
{{- fail "gateway.service.clusterIP must be set when agent.enabled is true: the node agent programs nftables to permit exactly one destination and needs that address before any pod starts. Run scripts/ro-preflight.sh; it reads a free address off this cluster and prints the install command with it filled in." }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rokh-oghab.fullname" . }}-agent
  namespace: {{ include "rokh-oghab.namespace" . }}
  labels:
    {{- include "rokh-oghab.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "rokh-oghab.agentSelectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "rokh-oghab.agentSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rokh-oghab.fullname" . }}-agent
      automountServiceAccountToken: false
      priorityClassName: {{ .Values.priorityClass.name }}
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "rokh-oghab.image" (list .Values.agent.image .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["run"]
          env:
            - name: RO_GATEWAY_ADDR
              value: {{ .Values.gateway.service.clusterIP | quote }}
            - name: RO_PROXY_PORT
              value: {{ .Values.gateway.service.proxyPort | quote }}
            - name: RO_DNS_PORT
              value: {{ .Values.gateway.service.dnsPort | quote }}
            - name: RO_TRANSPARENT_HTTP_PORT
              value: {{ .Values.gateway.service.transparentHttpPort | quote }}
            - name: RO_TRANSPARENT_TLS_PORT
              value: {{ .Values.gateway.service.transparentTlsPort | quote }}
            - name: RO_SANDBOX_CIDRS
              value: {{ join "," .Values.sandbox.podCidrs | quote }}
            - name: RO_SANDBOX_CIDRS6
              value: {{ join "," .Values.sandbox.podCidrs6 | quote }}
            {{- with .Values.sandbox.interfaces }}
            - name: RO_SANDBOX_IFACES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: RO_IPV6_UNSCOPED
              value: {{ .Values.agent.ipv6Unscoped | quote }}
            - name: RO_FLUSH_CONNTRACK
              value: {{ .Values.agent.flushConntrack | quote }}
            - name: RO_BOOTSTRAP_DENY
              value: {{ .Values.agent.bootstrapDeny | quote }}
            {{- with .Values.agent.allowCidrs }}
            - name: RO_ALLOW_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: RO_HOOK
              value: {{ .Values.agent.hook | quote }}
            - name: RO_BLOCK_IPV6
              value: {{ .Values.agent.blockIPv6 | quote }}
            - name: RO_TRANSPARENT
              value: {{ .Values.agent.transparent | quote }}
            - name: RO_LOG_DROPS
              value: {{ .Values.agent.logDrops | quote }}
            - name: RO_RECONCILE_SECONDS
              value: {{ .Values.agent.reconcileSeconds | quote }}
            - name: RO_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["ro-agent", "status"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
