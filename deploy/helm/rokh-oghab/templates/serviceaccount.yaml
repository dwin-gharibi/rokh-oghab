apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rokh-oghab.fullname" . }}-gateway
  namespace: {{ include "rokh-oghab.namespace" . }}
  labels:
    {{- include "rokh-oghab.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rokh-oghab.fullname" . }}-controller
  namespace: {{ include "rokh-oghab.namespace" . }}
  labels:
    {{- include "rokh-oghab.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rokh-oghab.fullname" . }}-agent
  namespace: {{ include "rokh-oghab.namespace" . }}
  labels:
    {{- include "rokh-oghab.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.sandbox.serviceAccount.create }}
{{- range $ns := .Values.sandbox.namespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.sandbox.serviceAccount.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rokh-oghab
automountServiceAccountToken: false
{{- end }}
{{- end }}
