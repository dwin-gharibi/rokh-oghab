apiVersion: v1
kind: Service
metadata:
  name: rokh-oghab-gateway
  namespace: rokh-oghab
  labels:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  clusterIP: 10.96.0.53
  selector:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: gateway
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: transparent-http
      port: 3080
      targetPort: t-http
      protocol: TCP
    - name: transparent-tls
      port: 3443
      targetPort: t-tls
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rokh-oghab-gateway-admin
  namespace: rokh-oghab
  labels:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: gateway
  ports:
    - name: admin
      port: 9145
      targetPort: admin
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokh-oghab-gateway
  namespace: rokh-oghab
  labels:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokh-oghab
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokh-oghab
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9145"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: rokh-oghab-gateway
      automountServiceAccountToken: false
      priorityClassName: rokh-oghab-critical
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rokh-oghab
              app.kubernetes.io/component: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/rokh-oghab/gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
            - name: t-http
              containerPort: 3080
              protocol: TCP
            - name: t-tls
              containerPort: 3443
              protocol: TCP
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: admin
              containerPort: 9145
              protocol: TCP
          env:
            - name: RO_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RO_CONTROLLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-gateway-tokens
                  key: controller
            - name: RO_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-gateway-tokens
                  key: admin
            - name: RO_ADMIN_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-gateway-tokens
                  key: adminOperator
                  optional: true
            - name: RO_ADMIN_READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-gateway-tokens
                  key: adminReader
                  optional: true
            - name: RO_OTEL_ENABLED
              value: "false"
            - name: RO_OTEL_ENDPOINT
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /etc/rokh-oghab/gateway.json
              subPath: gateway.json
              readOnly: true
            - name: bundle
              mountPath: /etc/rokh-oghab/bundle
              readOnly: true
            - name: run
              mountPath: /run/rokh-oghab
      volumes:
        - name: config
          configMap:
            name: rokh-oghab-gateway-config
        - name: bundle
          configMap:
            name: rokh-oghab-bootstrap-bundle
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rokh-oghab-gateway
  namespace: rokh-oghab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rokh-oghab
      app.kubernetes.io/component: gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rokh-oghab-gateway
  namespace: rokh-oghab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rokh-oghab-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
