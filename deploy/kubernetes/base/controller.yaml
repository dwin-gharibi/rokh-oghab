apiVersion: v1
kind: Service
metadata:
  name: rokh-oghab-controller
  namespace: rokh-oghab
  labels:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: controller
  ports:
    - name: api
      port: 8081
      targetPort: api
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rokh-oghab-controller-data
  namespace: rokh-oghab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokh-oghab-controller
  namespace: rokh-oghab
  labels:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rokh-oghab
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokh-oghab
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: rokh-oghab-controller
      automountServiceAccountToken: false
      priorityClassName: rokh-oghab-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/rokh-oghab/controller:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: api
              containerPort: 8081
              protocol: TCP
          env:
            - name: RO_CONTROLLER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-controller-tokens
                  key: admin
            - name: RO_CONTROLLER_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-controller-tokens
                  key: operator
            - name: RO_CONTROLLER_READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-controller-tokens
                  key: reader
            - name: RO_CONTROLLER_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rokh-oghab-controller-tokens
                  key: gateway
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/rokh-oghab
            - name: run
              mountPath: /run/rokh-oghab
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rokh-oghab-controller-data
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
