apiVersion: v1
kind: Secret
metadata:
  name: rokh-oghab-controller-tokens
  namespace: rokh-oghab
type: Opaque
stringData:
  admin: replace-me-with-32-random-bytes
  operator: replace-me-with-32-random-bytes
  reader: replace-me-with-32-random-bytes
  gateway: replace-me-with-32-random-bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: rokh-oghab-gateway-tokens
  namespace: rokh-oghab
type: Opaque
stringData:
  controller: replace-me-with-the-same-value-as-controller-tokens-gateway
  admin: replace-me-with-32-random-bytes
