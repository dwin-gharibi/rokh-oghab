apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: rokh-oghab
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - rbac.yaml
  - priorityclass.yaml
  - config.yaml
  - controller.yaml
  - gateway.yaml
  - agent.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/rokh-oghab/gateway
    newTag: latest
  - name: ghcr.io/rokh-oghab/controller
    newTag: latest
  - name: ghcr.io/rokh-oghab/agent
    newTag: latest
