apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rokh-oghab-agent
  namespace: rokh-oghab
  labels:
    app.kubernetes.io/name: rokh-oghab
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rokh-oghab
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokh-oghab
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: rokh-oghab-agent
      automountServiceAccountToken: false
      priorityClassName: rokh-oghab-critical
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 10
      containers:
        - name: agent
          image: ghcr.io/rokh-oghab/agent:latest
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            - name: RO_GATEWAY_ADDR
              value: "10.96.0.53"
            - name: RO_PROXY_PORT
              value: "3128"
            - name: RO_DNS_PORT
              value: "53"
            - name: RO_SANDBOX_CIDRS
              value: "10.244.0.0/16"
            - name: RO_SANDBOX_CIDRS6
              value: ""
            - name: RO_IPV6_UNSCOPED
              value: "refuse"
            - name: RO_HOOK
              value: "forward"
            - name: RO_BLOCK_IPV6
              value: "true"
            - name: RO_TRANSPARENT
              value: "false"
            - name: RO_RECONCILE_SECONDS
              value: "15"
            - name: RO_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            exec:
              command: ["ro-agent", "status"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
