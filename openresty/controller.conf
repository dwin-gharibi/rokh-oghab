worker_processes 2;
error_log /dev/stderr notice;
pid /run/rokh-oghab/controller.pid;
daemon off;

env RO_CONTROLLER_CONFIG;
env RO_CONTROLLER_DATA_DIR;
env RO_CONTROLLER_ADMIN_TOKEN;
env RO_CONTROLLER_OPERATOR_TOKEN;
env RO_CONTROLLER_READER_TOKEN;
env RO_CONTROLLER_GATEWAY_TOKEN;
env RO_CONTROLLER_BUNDLE_SIGNING_KEY;

events {
    worker_connections 2048;
}

http {
    access_log off;
    server_tokens off;
    default_type application/json;
    client_body_temp_path /tmp/ro-client-body;
    proxy_temp_path /tmp/ro-proxy;
    fastcgi_temp_path /tmp/ro-fastcgi;
    uwsgi_temp_path /tmp/ro-uwsgi;
    scgi_temp_path /tmp/ro-scgi;

    lua_package_path "/usr/local/rokh-oghab/lua/?.lua;;";
    lua_code_cache on;

    lua_shared_dict roc_lock 1m;
    lua_shared_dict ro_metrics 8m;
    lua_shared_dict ro_audit 8m;

    init_by_lua_block {
        require("roc.init").init()
    }

    init_worker_by_lua_block {
        require("roc.init").init_worker()
    }

    server {
        listen 8081 backlog=512;
        server_name _;
        client_max_body_size 8m;
        client_body_buffer_size 1m;
        keepalive_timeout 30s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location / {
            content_by_lua_block {
                require("roc.api").handle()
            }
        }
    }
}
