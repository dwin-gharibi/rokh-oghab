worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/testdns.pid;
daemon off;
events { worker_connections 512; }
stream {
    lua_package_path "/usr/local/rokh-oghab/lua/?.lua;/etc/testdns/?.lua;;";
    server {
        listen 53 udp;
        content_by_lua_block { require("server").run() }
    }
}
