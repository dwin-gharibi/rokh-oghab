worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/origin.pid;
env ORIGIN_NAME;
daemon off;
events { worker_connections 1024; }
http {
    access_log off;
    default_type application/json;
    lua_shared_dict origin_state 1m;

    server {
        listen 80 default_server;
        listen 8080;
        listen 443 ssl default_server;
        listen 8443 ssl;
        listen 9443 ssl;
        server_name _;
        ssl_certificate /etc/origin/certs/origin.crt;
        ssl_certificate_key /etc/origin/certs/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"origin":"', os.getenv("ORIGIN_NAME") or "origin",
                    '","scheme":"', ngx.var.scheme,
                    '","host":"', ngx.var.host,
                    '","sni":"', ngx.var.ssl_server_name or "",
                    '"}')
            }
        }

        location = /echo {
            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data() or ""
                local h = ngx.req.get_headers()
                ngx.header["Content-Type"] = "application/json"
                ngx.say(require("cjson").encode({
                    origin = os.getenv("ORIGIN_NAME") or "origin",
                    method = ngx.req.get_method(),
                    uri = ngx.var.request_uri,
                    body_length = #body,
                    body_sha = ngx.md5(body),
                    host = h["host"],
                    proxy_authorization = h["proxy-authorization"] and "PRESENT" or "ABSENT",
                    connection = h["connection"],
                    user_agent = h["user-agent"],
                    headers = h,
                }))
            }
        }

        location = /redirect {
            content_by_lua_block {
                local to = ngx.unescape_uri(ngx.var.arg_to or "/")
                ngx.status = 302
                ngx.header["Location"] = to
                ngx.header["Content-Length"] = 0
                ngx.send_headers()
                ngx.exit(302)
            }
        }

        location = /big {
            content_by_lua_block {
                local n = tonumber(ngx.var.arg_n) or 1024
                if n > 20000000 then n = 20000000 end
                ngx.header["Content-Type"] = "application/octet-stream"
                ngx.header["Content-Length"] = n
                local block = string.rep("A", 65536)
                local sent = 0
                while sent < n do
                    local want = n - sent
                    if want > 65536 then want = 65536 end
                    ngx.print(string.sub(block, 1, want))
                    sent = sent + want
                end
            }
        }

        location = /chunked {
            content_by_lua_block {
                local n = tonumber(ngx.var.arg_n) or 10
                ngx.header["Content-Type"] = "text/plain"
                for i = 1, n do
                    ngx.print(string.format("chunk-%04d\n", i))
                    ngx.flush(true)
                end
            }
        }

        location = /noclen {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                ngx.header["Connection"] = "close"
                ngx.print("close-delimited-body")
                ngx.eof()
            }
        }

        location = /slow {
            content_by_lua_block {
                local ms = tonumber(ngx.var.arg_ms) or 100
                if ms > 10000 then ms = 10000 end
                ngx.sleep(ms / 1000)
                ngx.say('{"slept_ms":', ms, '}')
            }
        }

        location = /status {
            content_by_lua_block {
                local code = tonumber(ngx.var.arg_code) or 200
                ngx.status = code
                ngx.say('{"status":', code, '}')
                ngx.exit(code)
            }
        }

        location / {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"origin":"', os.getenv("ORIGIN_NAME") or "origin",
                    '","path":"', ngx.var.uri, '"}')
            }
        }
    }
}

stream {
    server {
        listen 9052;
        content_by_lua_block {
            local sock = ngx.req.socket(true)
            if not sock then return end
            sock:settimeout(60000)
            local line = sock:receive("*l")
            if not line then return end
            sock:send("HOLDING\r\n")
            ngx.sleep(45)
            sock:send("LATE\r\n")
        }
    }

    server {
        listen 9051;
        content_by_lua_block {
            local sock = ngx.req.socket(true)
            if not sock then return end
            sock:settimeout(20000)
            local line = sock:receive("*l")
            if not line then return end
            local block = string.rep("R", 4096)
            for i = 1, 256 do
                local ok = sock:send(block)
                if not ok then return end
                if i % 32 == 0 then ngx.sleep(0.05) end
            end
            sock:send("ENDOFSTREAM\r\n")
        }
    }

    server {
        listen 9050;
        content_by_lua_block {
            local sock = ngx.req.socket(true)
            if not sock then return end
            sock:settimeout(15000)
            ngx.sleep(1.5)
            local ok = sock:send("220 origin-a ESMTP ready\r\n")
            if not ok then return end
            while true do
                local line, err = sock:receive("*l")
                if not line then return end
                if line:upper():find("^QUIT") then
                    sock:send("221 bye\r\n")
                    return
                end
                sock:send("250 " .. line .. "\r\n")
            end
        }
    }
}
