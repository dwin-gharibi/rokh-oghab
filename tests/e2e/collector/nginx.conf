worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/collector.pid;
daemon off;
events { worker_connections 256; }
http {
    access_log off;
    lua_shared_dict otlp 32m;
    client_body_buffer_size 8m;
    client_max_body_size 8m;
    server {
        listen 4318;

        location = /v1/traces {
            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if not body then
                    local path = ngx.req.get_body_file()
                    if path then
                        local fh = io.open(path, "rb")
                        if fh then
                            body = fh:read("*a")
                            fh:close()
                        end
                    end
                end
                body = body or ""
                local d = ngx.shared.otlp
                local n = d:incr("count", 1, 0)
                d:set("last", body)
                d:set("b:" .. (n % 64), body)
                ngx.status = 200
                ngx.header["Content-Type"] = "application/json"
                ngx.say("{}")
            }
        }

        location = /collected {
            content_by_lua_block {
                local d = ngx.shared.otlp
                local cjson = require("cjson")
                local out, n = {}, 0
                local total = d:get("count") or 0
                for i = 0, 63 do
                    local b = d:get("b:" .. i)
                    if b then n = n + 1; out[n] = b end
                end
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode({ posts = total, bodies = out }))
            }
        }

        location = /reset {
            content_by_lua_block {
                ngx.shared.otlp:flush_all()
                ngx.say("{}")
            }
        }
    }
}
